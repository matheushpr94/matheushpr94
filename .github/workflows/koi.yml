# Desenha o koi do perfil a partir da atividade pública (yalongwastaken/git-koi),
# coloca num lago e escreve a legenda no README (koi/lago.py).
# O git-koi está fixado no commit revisado em 06/11/2026 (v1.0.2), não na tag móvel @v1.
# O binário é baixado da release e conferido pelo sha256 publicado.
# Também desenha o Pac-Man comendo o calendário do ano (pacman/gerar.mjs) com a BIBLIOTECA
# pacman-contribution-graph 5.5.2 (versão e hashes fixos no package-lock.json). O action pronto do
# autor não é usado: ele envia o usuário e a pontuação para o servidor dele (ranking público).
# Aqui o domínio do autor fica bloqueado na rede durante a geração e o código instalado é conferido.
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml, koi/lago.py, pacman/gerar.mjs, pacman/package-lock.json]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Baixar git-koi v1.0.2 e conferir o sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          a=git-koi-1.0.2-x86_64-unknown-linux-musl.tar.gz
          gh release download v1.0.2 --repo yalongwastaken/git-koi --dir "$RUNNER_TEMP" --pattern "$a" --pattern "$a.sha256"
          cd "$RUNNER_TEMP" && sha256sum -c "$a.sha256" && tar -xzf "$a"
          echo "$RUNNER_TEMP/git-koi-1.0.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Coletar e desenhar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git-koi collect "${{ github.repository_owner }}" --output "$RUNNER_TEMP/snap.json"
          git-koi render "$RUNNER_TEMP/snap.json" --output-dir koi --body white | tee "$RUNNER_TEMP/render.txt"
          # primeira palavra(s) antes de " for ": cruise, dart, rest, deep rest, surface feeding
          sed -E 's/ for .*//' "$RUNNER_TEMP/render.txt" | head -1 > "$RUNNER_TEMP/comportamento.txt"
      - name: Lago e legenda
        run: |
          pip install --quiet pillow==11.3.0 numpy==2.3.4
          python koi/lago.py "$RUNNER_TEMP/snap.json" koi/koi.gif "$(cat "$RUNNER_TEMP/comportamento.txt")" README.md
      - name: Pac-Man (sem enviar nada ao autor)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # bloqueia na rede os domínios do autor (servidor de estatística e o do caminho GitLab, que não usamos)
          echo "0.0.0.0 elec.abozanona.me abozanona.me pacman.abozanona.me v0-new-project-q1hhrdodoye-abozanona-gmailcoms-projects.vercel.app" | sudo tee -a /etc/hosts >/dev/null
          cd pacman
          npm ci --ignore-scripts --no-audit --no-fund
          # a biblioteca só pode citar estes endereços (conferido na 5.5.2); qualquer outro aborta
          f=node_modules/pacman-contribution-graph/dist/pacman-contribution-graph.min.js
          grep -oE "https?://[a-zA-Z0-9./_-]+" "$f" | sort -u > /tmp/urls.txt
          printf '%s\n' http://www.w3.org/2000/svg https://api.github.com/graphql https://api.github.com/search/commits \
            https://github.com/Platane/snk https://v0-new-project-q1hhrdodoye-abozanona-gmailcoms-projects.vercel.app/api/contributions | sort -u > /tmp/permitidos.txt
          if ! diff /tmp/permitidos.txt /tmp/urls.txt; then echo "A biblioteca mudou de endereços: abortado."; exit 1; fi
          node gerar.mjs "${{ github.repository_owner }}" .
      - name: Commit se mudou
        shell: bash
        run: |
          git add koi/koi.gif koi/lago.gif README.md pacman/pacman.svg pacman/pacman-escuro.svg
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "perfil: koi e pac-man do dia"
          git push --quiet
